; v2: ESP32-C6 SuperMini, 4 PWM/Tach + DS18B20 (hardware/v2-c6-4ch)
; Legacy 1-channel DevKitC sources: legacy/1ch/ (BOM: hardware/bom-1channel.csv)
; C6 instead of C3 because of stock (9x C6 vs 3x C3). Pinout differs - C3 does not fit.

[env:esp32-c6-supermini]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
